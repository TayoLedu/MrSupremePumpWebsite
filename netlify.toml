# The site is plain static files at the repo root, so there is no build step.
# Setting publish here overrides whatever is configured in the Netlify UI, which
# keeps the deploy reproducible from the repo alone.
[build]
  publish = "."

[[headers]]
  for = "/assets/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
